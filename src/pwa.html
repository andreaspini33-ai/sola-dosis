<style>
#sd-update{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;display:none;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:10px;background:#0B3A2C;color:#F3E7C0;box-shadow:inset 0 0 0 1.5px #C9A227,0 10px 30px -10px rgba(0,0,0,.6);font:500 14px/1.3 "IBM Plex Sans",system-ui,sans-serif}
#sd-update.on{display:flex}
#sd-update button{flex:none;border:0;border-radius:7px;padding:8px 12px;background:#C9A227;color:#0B3A2C;font:700 13px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
#sd-foot{max-width:1100px;margin:24px auto 0;padding:12px 16px 28px;font:400 11px/1.5 "JetBrains Mono",ui-monospace,monospace;color:#6B7680;text-align:center}
#sd-foot b{font-weight:600}
</style>
<div id="sd-update" role="status" aria-live="polite"><span>È disponibile una nuova versione di Sola Dosis.</span><button type="button" id="sd-update-btn">Aggiorna</button></div>
<footer id="sd-foot">Sola Dosis · versione <b>__VERSION__</b>__ENV__ · uso didattico: valori stimati e regole sono scelte di gioco, non indicazioni cliniche.</footer>
<script>
(function(){
  if(!("serviceWorker" in navigator))return;
  var bar=document.getElementById("sd-update"),btn=document.getElementById("sd-update-btn"),reloading=false;
  function show(reg){bar.classList.add("on");btn.onclick=function(){btn.disabled=true;if(reg.waiting)reg.waiting.postMessage("skip")}}
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloading)return;reloading=true;location.reload()});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller)show(reg);
      reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;
        w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)show(reg)})});
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")reg.update().catch(function(){})});
      setInterval(function(){reg.update().catch(function(){})},30*60*1000);
    }).catch(function(){});
  });
})();
</script>
