<style>
/* Layout: banco di laboratorio. Header con schede, area di gioco centrale; le carte sono etichette di confezioni farmaceutiche. */
:root{
  --bg:#E7ECEA; --surface:#F9FBFA; --surface-2:#EEF2F0; --ink:#13201C; --muted:#56655F; --line:#C5CFCB;
  --accent:#2445C2; --accent-ink:#FFFFFF; --danger:#BE3329; --good:#1D7448; --gold:#9A6A12; --warn:#A35C00;
  --c-analg:#B03F79; --c-snc:#6D47B8; --c-cardio:#BC3445; --c-emo:#8E2F2F; --c-anti:#2A8253; --c-antid:#A86E14; --c-endo:#2A6DAA;
  --c-rec:#0F7C86; --c-int:#5B5F66; --c-sci:#7A5A12; --c-act:#3E5C8A; --c-dis:#8A3F8F;
  --paper:#FCFDFB; --stat-e:#2445C2; --stat-t:#1D7448;
  --atom-o:#C2371F; --atom-n:#1F5FBF; --atom-s:#A07A00; --atom-x:#14805A; --atom-li:#7B3FA6;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(19,32,28,.06),0 6px 18px -10px rgba(19,32,28,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#172019; --surface-2:#1E2925; --ink:#E2EAE6; --muted:#93A39C; --line:#2E3B36;
  --accent:#8EA2FF; --accent-ink:#0E1412; --danger:#FF7A6E; --good:#5FD093; --gold:#E3B44E; --warn:#F2A447;
  --c-analg:#E07AB0; --c-snc:#A88BEB; --c-cardio:#F0707E; --c-emo:#D9777A; --c-anti:#62C68E; --c-antid:#E0A64A; --c-endo:#6EAEE6;
  --c-rec:#47BFC9; --c-int:#A3A9B2; --c-sci:#D8B25A; --c-act:#8FB0E6; --c-dis:#D08AD6;
  --paper:#1A2320; --stat-e:#4F6BE8; --stat-t:#2B8A57;
  --atom-o:#FF7A66; --atom-n:#7FA8FF; --atom-s:#E8C14A; --atom-x:#5FD3A0; --atom-li:#C69BFF;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#172019; --surface-2:#1E2925; --ink:#E2EAE6; --muted:#93A39C; --line:#2E3B36;
  --accent:#8EA2FF; --accent-ink:#0E1412; --danger:#FF7A6E; --good:#5FD093; --gold:#E3B44E; --warn:#F2A447;
  --c-analg:#E07AB0; --c-snc:#A88BEB; --c-cardio:#F0707E; --c-emo:#D9777A; --c-anti:#62C68E; --c-antid:#E0A64A; --c-endo:#6EAEE6;
  --c-rec:#47BFC9; --c-int:#A3A9B2; --c-sci:#D8B25A; --c-act:#8FB0E6; --c-dis:#D08AD6;
  --paper:#1A2320; --stat-e:#4F6BE8; --stat-t:#2B8A57;
  --atom-o:#FF7A66; --atom-n:#7FA8FF; --atom-s:#E8C14A; --atom-x:#5FD3A0; --atom-li:#C69BFF;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:20px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--f-display);font-weight:850;font-stretch:72%;font-size:2.3rem;letter-spacing:.01em;line-height:.9;margin:0;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.82rem;font-family:var(--f-mono)}
.credits{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.credits b{color:var(--ink);font-size:1.05rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;flex-basis:100%}
nav.tabs button{background:none;border:1px solid transparent;border-radius:6px;padding:7px 14px;font-family:var(--f-display);font-weight:700;font-stretch:85%;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
main{padding-top:18px}
h2.sec{font-family:var(--f-display);font-weight:800;font-stretch:80%;text-transform:uppercase;font-size:1.25rem;letter-spacing:.03em;margin:0 0 4px;text-wrap:balance}
h3.sub3{font-family:var(--f-display);font-weight:800;font-stretch:80%;text-transform:uppercase;font-size:1rem;letter-spacing:.03em;margin:22px 0 6px}
.sub{color:var(--muted);margin:0 0 16px;max-width:68ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mono{font-family:var(--f-mono)}

/* CARTE: confezione farmaceutica. La scatola resta bianca in entrambi i temi; dimensioni in em, scalate per modalità */
.card{--kp:#FFFFFF;--ki:#1B2229;--km:#5D6873;--kl:#E3E7EA;--kg:#F1F4F6;position:relative;width:21em;font-size:12px;aspect-ratio:63/88;box-sizing:border-box;background:var(--kp);color:var(--ki);border:0;padding:0;border-radius:.85em;
  box-shadow:0 1px 0 rgba(20,30,40,.1),0 .8em 1.8em -1.1em rgba(10,20,30,.55);display:flex;flex-direction:column;overflow:hidden;text-align:left;flex:none;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.card .band{flex:none;height:1em;background:var(--cc);position:relative}
.card .band::after{content:"";position:absolute;right:0;top:1em;width:7em;height:.5em;background:var(--cc);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.card.t-int .band{height:1.15em;background:repeating-linear-gradient(-45deg,#F2B705 0 .75em,#1B2229 .75em 1.5em)}
.card.t-int .band::after{display:none}
.card .top{flex:none;display:flex;justify-content:space-between;align-items:flex-start;gap:.6em;padding:1.1em 1.15em 0}
.card .nm{min-width:0;font-family:"Schibsted Grotesk",sans-serif;font-weight:800;font-size:1.75em;line-height:1.02;letter-spacing:-.01em;overflow-wrap:break-word;hyphens:auto;text-wrap:balance}
.card .nm.n10{font-size:1.45em}.card .nm.n14{font-size:1.25em}.card .nm.n18{font-size:1.12em}
.card .nm small{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;font-size:.45em;letter-spacing:.06em;text-transform:uppercase;color:var(--km);margin-top:.45em;line-height:1.3}
.card .dose{flex:none;width:3.5em;height:3.5em;box-sizing:border-box;border:.17em solid var(--ki);border-radius:.5em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.card .dose b{font-family:"Schibsted Grotesk",sans-serif;font-weight:900;font-size:1.8em}
.card .dose span{font-family:"JetBrains Mono",monospace;font-size:.62em;text-transform:uppercase;letter-spacing:.08em;margin-top:.2em}
.card .art{flex:1;min-height:5em;position:relative;margin:.85em 1.15em 0;border-top:1px solid var(--kl);border-bottom:1px solid var(--kl);color:var(--ki);background-image:linear-gradient(var(--kg) 1px,transparent 1px),linear-gradient(90deg,var(--kg) 1px,transparent 1px);background-size:1em 1em}
.card .art svg{position:absolute;inset:8% 4%;width:92%;height:84%;color:var(--cc)}
.card .art svg.mol{color:var(--ki)}
.card .indic,.card .badge,.card .new{position:absolute;top:.4em;font-family:"JetBrains Mono",monospace;font-size:.68em;padding:.1em .45em;border-radius:.25em;text-transform:uppercase;letter-spacing:.05em}
.card .indic{left:0;background:var(--c-dis);color:#fff}
.card .badge{right:0;background:var(--ki);color:var(--kp)}
.card .new{right:0;top:auto;bottom:.4em;background:#B07A12;color:#fff}
.card .meta{flex:none;display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.65em 1.15em 0}
.card .reg{font-family:"JetBrains Mono",monospace;font-size:.7em;text-transform:uppercase;letter-spacing:.08em;padding:.15em .5em;border-radius:.25em;border:1px solid var(--ki);white-space:nowrap}
.card .reg.stup{background:#B3261E;border-color:#B3261E;color:#fff}
.card .reg.rx{background:var(--ki);color:var(--kp)}
.card .reg.hz{background:#F2B705;border-color:#F2B705;color:#1B2229}
.card .br{font-size:1.05em;letter-spacing:.08em;color:#C3CAD0;white-space:nowrap;overflow:hidden;min-width:0}
.card .tx{flex:none;display:block;margin:.45em 1.15em 0;font-size:.92em;line-height:1.33;color:#3A444E;max-height:4em;overflow:hidden}
.card .tx b{color:var(--ki)}
.card .tx .ev{display:block;font-family:"JetBrains Mono",monospace;font-size:.85em;color:var(--km);margin-top:.3em}
.card .tx .fact{display:block;font-style:italic;color:var(--km);margin-top:.35em}
.card.full .tx{max-height:none}
.card .tab{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:.6em 1.15em 0;border:.13em solid var(--ki);border-radius:.3em}
.card .tab.one{grid-template-columns:minmax(0,1fr)}
.card .tab>span{display:flex;justify-content:space-between;align-items:baseline;gap:.3em;padding:.3em .6em;min-width:0}
.card .tab>span+span{border-left:.13em solid var(--ki)}
.card .tab i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:.7em;text-transform:uppercase;letter-spacing:.05em;color:var(--km);white-space:nowrap}
.card .tab b{font-family:"Schibsted Grotesk",sans-serif;font-weight:900;font-size:1.65em;line-height:1}
.card .tab b.sm{font-size:1.05em;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tab b.up{color:#13804F}
.card .tab b.hurt{color:#B3261E}
.card .lot{flex:none;display:flex;justify-content:space-between;gap:.5em;padding:.55em 1.15em .8em;font-family:"JetBrains Mono",monospace;font-size:.7em;color:#8A949D;letter-spacing:.04em}
.card .lot span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* rarità */
.card.r-R .dose{box-shadow:0 0 0 .14em #fff,0 0 0 .3em #C9A227}
.card.r-L::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.55) 40%,rgba(255,170,240,.25) 47%,rgba(140,220,255,.25) 54%,transparent 70%);background-size:260% 100%;mix-blend-mode:multiply;opacity:.6;animation:foil 7s linear infinite}
.card.r-L .dose{box-shadow:0 0 0 .14em #fff,0 0 0 .3em #9B6CF0}
@keyframes foil{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.card.r-L::after{animation:none;background-position:50% 0}}
/* strutture */
.mol line,.mol circle{stroke-width:1.7;stroke-linecap:round}.mol circle{fill:none}
.mol.sch circle{stroke:none}
.mol text{font:600 13px "JetBrains Mono",monospace;paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round;fill:currentColor}
.mol text.lab{font-size:9px;letter-spacing:.06em;stroke-width:4px;fill:#5D6873}
.mol .aO{fill:#C2371F}.mol .aN{fill:#1F5FBF}.mol .aS{fill:#A07A00}.mol .aCl,.mol .aF{fill:#14805A}.mol .aH{fill:#5D6873}.mol .aLi{fill:#7B3FA6}
.mol .sub{font-size:8px}
.ill .lab{font:600 8.5px "JetBrains Mono",monospace;letter-spacing:.04em;fill:currentColor}
/* modalità */
.card.full{width:100%;font-size:12.5px;aspect-ratio:auto;min-height:30em}
.card.full .art{min-height:9em}
.card.hand{width:21em;font-size:8px}
.card.hand .lot{display:none}
.card.hand .tx{max-height:2.7em}
.card.board{width:21em;font-size:6.2px}
.card.board .meta,.card.board .tx,.card.board .lot{display:none}
.card.board .nm{font-size:1.9em}.card.board .nm.n10{font-size:1.45em}.card.board .nm.n14{font-size:1.25em}.card.board .nm.n18{font-size:1.1em}.card.board .nm small{display:none}
.card.board .tab{margin-bottom:1em}
.card.board .tab b{font-size:2em}
/* stati */
.card.locked{filter:grayscale(1);opacity:.45}
.card.ready{box-shadow:0 0 0 2px var(--accent),0 .6em 1.2em -1em #000}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--accent),0 .6em 1.2em -1em #000}
.card.target{box-shadow:0 0 0 3px var(--danger);cursor:crosshair}
.card.playable{box-shadow:0 0 0 2px var(--good),0 .6em 1.2em -1em #000}
.card.playable:hover,.card.ready:hover{transform:translateY(-3px)}
.card.dim{opacity:.55}
.card.board.tapped{transform:rotate(7deg);filter:saturate(.35)}
.card.taunt-mark::before{content:"";position:absolute;inset:.35em;border:.3em double var(--cc);border-radius:.6em;pointer-events:none;z-index:2}
button.card{transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
button.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){button.card{transition:none}.card.sel,.card.playable:hover,.card.ready:hover{transform:none}}

/* DUELLO */
.duel{display:grid;gap:10px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%;text-align:left}
.hero.target{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger);cursor:crosshair}
.hero .who{font-family:var(--f-display);font-weight:800;font-stretch:80%;text-transform:uppercase;font-size:1rem;min-width:110px}
.meter{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:3px}
.meter .bar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;background:var(--good)}
.meter .bar i.low{background:var(--danger)}
.meter .bar i.cure{background:var(--c-rec)}
.meter small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.dose{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.dose i{width:9px;height:14px;border-radius:2px;border:1px solid var(--accent);display:inline-block}
.dose i.on{background:var(--accent)}
.meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.recs{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;align-items:center}
.reclab{flex-basis:100%;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);letter-spacing:.04em}
.reccards{display:flex;gap:10px;flex-wrap:wrap}.reccards .card{cursor:zoom-in}
.recchip{font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--c-rec);color:var(--c-rec);border-radius:12px;padding:1px 8px}
.warnchip{font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:1px 8px}
.boardrow{min-height:170px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.boardrow .empty{color:var(--muted);font-size:.8rem;font-family:var(--f-mono)}
.patient{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 12px;border:1px solid var(--c-dis);border-radius:8px;background:var(--surface)}
.patient b{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;font-weight:800;font-size:1rem}
.patient span{font-size:.8rem;color:var(--muted);min-width:0}
.respond{display:grid;gap:8px;padding:12px;border:2px solid var(--warn);border-radius:8px;background:var(--surface)}
.respond b{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;font-weight:800}
.respond span{font-size:.82rem;color:var(--muted)}
.patient.empty{border-style:dashed;border-color:var(--line)}
.logline{font-size:.82rem;color:var(--muted);text-align:center;min-height:1.4em;font-family:var(--f-mono)}
.handwrap{overflow-x:auto;padding:10px 2px 6px}
.hand{display:flex;gap:8px;width:max-content;margin:0 auto}
/* animazioni */
.card,.hero{position:relative}
.fx-enter{animation:fxEnter .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes fxEnter{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.fx-evolve{animation:fxEvolve .7s ease}
@keyframes fxEvolve{0%{filter:brightness(1)}35%{filter:brightness(1.8) saturate(1.4);transform:scale(1.08)}100%{filter:none;transform:none}}
.fx-lunge0{animation:lunge0 .5s ease}.fx-lunge1{animation:lunge1 .5s ease}
@keyframes lunge0{40%{transform:translateY(-34px) scale(1.06)}100%{transform:none}}
@keyframes lunge1{40%{transform:translateY(34px) scale(1.06)}100%{transform:none}}
.fx-hit{animation:hit .45s ease}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fx-hit::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(179,38,30,.35);animation:flash .45s forwards;pointer-events:none}
@keyframes flash{to{opacity:0}}
.card.dying{animation:die .7s forwards;pointer-events:none}
@keyframes die{0%{transform:none}30%{transform:scale(1.05);filter:brightness(1.5)}100%{transform:scale(.4) rotate(12deg);opacity:0;filter:grayscale(1)}}
.fnum{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:"Schibsted Grotesk",var(--f-display),sans-serif;font-weight:900;font-size:26px;color:#B3261E;text-shadow:0 1px 0 #fff,0 0 6px #fff;z-index:9;pointer-events:none;animation:floatUp 1.1s forwards;white-space:nowrap}
.fnum.good{color:#13804F}.fnum.cure{color:var(--c-rec)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
.fx-shake{animation:hit .5s ease}
.hero.fx-shake{box-shadow:0 0 0 2px var(--danger)}
.patient.fx-field{animation:fieldIn .7s ease}
@keyframes fieldIn{0%{transform:scaleY(.4);opacity:0}60%{transform:scaleY(1.05)}100%{transform:none;opacity:1}}
.meter .bar i{transition:width .6s ease}
.fx-pulse{animation:pulse .8s ease}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c-rec) 45%,transparent)}}
.reveal .fx-flip{animation:flip .6s ease}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:none}}
.reveal .fx-flip.r-R,.reveal .fx-flip.r-L{animation:flip .6s ease,glow 1.4s ease .5s}
@keyframes glow{40%{box-shadow:0 0 0 4px #C9A227,0 0 30px 6px rgba(201,162,39,.6)}}
/* guida */
body:has(#coach .cbox) main{padding-bottom:230px}
#coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));z-index:20}
#coach .cbox{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);display:grid;gap:8px}
#coach .cbox b.t{font-family:var(--f-display);font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;font-size:.95rem;color:var(--accent)}
#coach .cbox p{margin:0;font-size:.92rem;line-height:1.45}
#coach .cstep{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
#coach .nope{animation:hit .4s}
.coach-target{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px;animation:coachPulse 1.4s ease infinite}
@keyframes coachPulse{50%{outline-color:transparent}}
.sndbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fx-enter,.fx-evolve,.fx-lunge0,.fx-lunge1,.fx-hit,.fx-shake,.fx-field,.fx-pulse,.reveal .fx-flip,.coach-target{animation:none!important}.card.dying{animation:none;opacity:0}.fnum{animation-duration:1.2s}}
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.overlay h3{font-family:var(--f-display);font-weight:850;font-stretch:75%;text-transform:uppercase;font-size:1.8rem;margin:0 0 6px}
.detail{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:520px){.detail{grid-template-columns:1fr}}
.detail dl{margin:0;display:grid;gap:8px;font-size:.82rem}
.detail dt{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.detail dd{margin:0}
blockquote{margin:4px 0 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--surface-2);font-size:.78rem;font-style:normal}
.help{font-size:.82rem;color:var(--muted);max-width:72ch;display:grid;gap:8px}
.help b{color:var(--ink)}

/* BUSTINE */
.reveal{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.reveal .card{width:13.5em;font-size:12px}
.back{width:162px;aspect-ratio:63/88;border-radius:11px;position:relative;overflow:hidden;padding:0;cursor:pointer;background:repeating-radial-gradient(circle at 50% 50%,rgba(201,162,39,.16) 0 1px,transparent 1px 7px),radial-gradient(circle at 50% 45%,#16634B,#0B3A2C 75%);border:4px solid #0B3A2C;box-shadow:inset 0 0 0 1.5px #C9A227,inset 0 0 0 4px #0B3A2C,inset 0 0 0 5px rgba(201,162,39,.6),var(--shadow);color:#E2C35A;font:700 .72rem "Cinzel",serif;letter-spacing:.2em;text-transform:uppercase}
.back svg{position:absolute;inset:0;width:100%;height:100%}
.back .bl{position:absolute;left:0;right:0;bottom:9%;text-align:center}
.back small{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;font-family:var(--f-mono);font-size:.5rem;letter-spacing:.08em;color:#C9A227;font-weight:400;text-transform:none}
.back.mini{width:30px;border-width:2px;border-radius:4px;box-shadow:inset 0 0 0 1px #C9A227,0 1px 3px rgba(0,0,0,.35);cursor:default;flex:none}
.stackrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.fan{display:flex}.fan .back.mini+.back.mini{margin-left:-18px}
.pile{position:relative;display:inline-flex}.pile .back.mini{box-shadow:inset 0 0 0 1px #C9A227,2px 2px 0 #0B3A2C,4px 4px 0 #16634B,0 1px 3px rgba(0,0,0,.35)}
.new{position:absolute;bottom:32px;left:6px;font-family:var(--f-mono);font-size:.6rem;background:var(--gold);color:var(--surface);padding:0 5px;border-radius:3px}
.odds{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* COLLEZIONE */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:.78rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-bottom:10px}
.dislist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dis{border:1px solid var(--c-rec);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:.82rem}
.dis b{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;font-weight:800}
.dis p{margin:4px 0 0;color:var(--muted)}

/* MAZZO */
.deckgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.deckgrid{grid-template-columns:1fr}}
.list{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:.85rem}

.li .c{font-family:var(--f-mono);font-weight:600;text-align:center;border:1.5px solid var(--cc);border-radius:4px;font-size:.75rem}
.li .n{min-width:0}
.li .n b{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;font-weight:750}
.li .n small{display:block;color:var(--muted);font-size:.72rem}
.li .s{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.li button{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;width:30px;height:28px;font-weight:600}
.li button:disabled{opacity:.3}
.curve{display:flex;align-items:flex-end;gap:5px;height:70px;padding:8px 10px 0}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.curve div i{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.deckhead{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.8rem;gap:8px;flex-wrap:wrap}
.ok{color:var(--good)} .ko{color:var(--danger)}

/* FONTI */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.8rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-top:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:none;background:var(--surface-2)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.refs{font-size:.8rem;display:grid;gap:6px;padding-left:18px;max-width:80ch}

// costo calcolato dal valore della carta
function drugCost(d){const a=d.ab;let b=(d.E+0.6*d.T)/2;
  if(a.charge)b+=.5;if(a.taunt)b+=.3;if(a.heal)b+=a.heal*.3;if(a.antag)b+=.8;if(a.inhib)b+=a.inhib*.8;if(a.induce)b+=a.induce*.8;if(a.nti)b-=.8;
  return Math.max(1,Math.min(8,Math.round(b)))}
const CARDS={};
DRUGS.forEach(d=>{d.type="drug";d.c=drugCost(d);CARDS[d.id]=d});
RECS.forEach(d=>{d.type="rec";d.cl="rec";CARDS[d.id]=d});
INTS.forEach(d=>{d.type="int";d.cl="int";CARDS[d.id]=d});
SCIS.forEach(d=>{d.type="sci";d.cl="sci";CARDS[d.id]=d});
ACTS.forEach(d=>{d.type="act";d.cl="act";CARDS[d.id]=d});
DIS.forEach(d=>{d.type="dis";d.cl="dis";CARDS[d.id]=d});
DRUGS.forEach(d=>{if(d.from)d.ec=Math.max(1,d.c-CARDS[d.from].c)});
const ORDER=["analg","snc","cardio","emo","anti","antid","endo","dis","rec","int","sci","act"];

function abText(d,short){
  if(d.type==="rec"||d.type==="sci"||d.type==="act")return d.txt;
  if(d.type==="dis")return short?"<b>Campo</b>: farmaci indicati +1 efficacia":`<b>Carta campo</b>: i farmaci indicati (${d.ind.map(i=>CARDS[i].n).join(", ")}) +1 efficacia, per entrambi i giocatori. Sostituisce la condizione in campo e azzera la risposta terapeutica di tutti.`;
  if(d.type==="int")return short?`<b>Istantaneo</b>: ${d.sh||d.need.map(x=>TAGL[x[0]]||x[0]).join(" + ")}`:`<b>Istantaneo</b>: si gioca anche nel turno del rivale, in risposta al farmaco che completa la combinazione. ${d.txt}`;
  const a=d.ab,o=[];
  if(d.from&&!short)o.push(`<b>Evoluzione</b>: si gioca sopra ${CARDS[d.from].n} pagando ${d.ec}.`);
  if(a.charge)o.push(short?"<b>Rapido</b>":"<b>Rapido</b>: attacca subito.");
  if(a.taunt)o.push(short?"<b>Vigilanza</b>":"<b>Vigilanza</b>: attaccare non la impegna, quindi può parare nel turno del rivale.");
  if(a.heal)o.push(short?`<b>Sollievo ${a.heal}</b>`:`<b>Sollievo ${a.heal}</b>: recuperi ${a.heal} di omeostasi.`);
  if(a.antag)o.push(short?`<b>Antagonista</b>`:`<b>Antagonista</b>: elimina ${TAGN[a.antag]} avversari in campo.`);
  if(a.inhib)o.push(short?`<b>Inibitore +${a.inhib}</b>`:`<b>Inibitore CYP</b>: le tue altre carte in campo +${a.inhib} efficacia.`);
  if(a.induce)o.push(short?`<b>Induttore −${a.induce}</b>`:`<b>Induttore</b>: le carte avversarie in campo −${a.induce} efficacia.`);
  if(a.nti)o.push(short?"<b>Indice ristretto</b>":"<b>Indice ristretto</b>: a ogni tuo turno perdi 1 di omeostasi.");
  return o.join(short?" · ":" ");
}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let UID=0;

  const cl=CATS[Math.floor(Math.random()*CATS.length)];
  const own=id=>{const d=CARDS[id];return d.r==="L"?(Math.random()<.5?1:0):maxCopies(d)};
  const deck=shuffle(catDeck(cl,own));
  return deck;
}
function newPlayer(deck,name){return {name,hp:20,max:0,dose:0,deck:shuffle(deck.slice()),hand:[],board:[],recs:[],grave:[],fat:0,cure:0}}
function startDuel(){
  G={field:null,p:[newPlayer(S.deck,"Il tuo reparto"),newPlayer(aiDeck(),"Reparto rivale")],turn:0,sel:null,busy:false,over:false,log:"Tocca a te."};G.p[1].coin=true;
  for(let i=0;i<3;i++)draw(0);for(let i=0;i<4;i++)draw(1);
  startTurn(0);render();
}
function log(m){if(G)G.log=m}
function fx(o){if(G&&!G.sim)(G.fx=G.fx||[]).push(o)}
function draw(i){const P=G.p[i];if(!P.deck.length){P.fat++;P.hp-=P.fat;log(`${i?"Il rivale ha":"Hai"} esaurito il mazzo: −${P.fat} omeostasi.`);return}
  const c=P.deck.pop();if(P.hand.length<8)P.hand.push(c)}
const D=u=>CARDS[u.id];
const has=(u,t)=>D(u).tags.includes(t);
function effAtk(u,P){let e=u.atk+(isIndicated(u.id,fieldDis())?1:0);P.recs.forEach(r=>{const R=CARDS[r];if(has(u,R.tag))e+=R.e});return Math.max(0,e)}
function isTaunt(u,P){if(D(u).ab.taunt)return true;return P.recs.some(r=>CARDS[r].taunt&&has(u,CARDS[r].tag))}
function startTurn(i){
  const P=G.p[i];P.max=Math.min(10,P.max+1);P.dose=P.max;if(P.coin){P.dose++;P.coin=false}draw(i);
  let nti=0;P.board.forEach(u=>{u.can=true;u.tap=false;if(D(u).ab.nti)nti++});
  if(nti){P.hp-=nti;fx({k:"hero",side:i,n:nti});log(`Indice terapeutico ristretto: ${i?"il rivale perde":"perdi"} ${nti} di omeostasi.`)}
  const gain=P.board.filter(u=>isIndicated(u.id,fieldDis())).reduce((z,u)=>z+effAtk(u,P),0);
  if(gain){P.cure+=gain;fx({k:"cure",side:i,n:gain})}

function resolveCombat(i,atkUids,blocks){
  const P=G.p[i],O=G.p[1-i];const parts=[];let dmg=0;
  for(const uid of atkUids){const a=P.board.find(x=>x.uid===uid);if(!a)continue;
    a.can=false;if(!isTaunt(a,P))a.tap=true;
    const ea=effAtk(a,P);const bl=(blocks[uid]||[]).map(b=>O.board.find(x=>x.uid===b)).filter(Boolean);
    fx({k:"lunge",uid:a.uid,side:i});

    for(const b of bl){const k=Math.min(left,b.hp);b.hp-=k;left-=k;fx({k:"hit",uid:b.uid,n:k})}
    a.hp-=hit;fx({k:"hit",uid:a.uid,n:hit});
    const dead=bl.filter(b=>b.hp<=0).map(b=>D(b).n);
    parts.push(`${bl.map(b=>D(b).n).join(" e ")} para ${D(a).n}${a.hp<=0?`: ${D(a).n} eliminata`:""}${dead.length?`${a.hp<=0?",":":"} ${dead.join(" e ")} eliminat${dead.length>1?"e":"a"}`:""}`)}

function aiChooseAttackers(i){

  const blockers=O.board.filter(canBlock);
  const pw=cand.map(u=>effAtk(u,P)).sort((a,b)=>b-a);
  if(pw.slice(blockers.length).reduce((a,b)=>a+b,0)>=O.hp)return cand.map(u=>u.uid);
  let res=cand.filter(u=>{const ea=effAtk(u,P);return !blockers.some(b=>effAtk(b,O)>=u.hp&&ea<b.hp)});
  const threat=O.board.reduce((z,b)=>z+effAtk(b,O),0);

  return res.map(u=>u.uid);

function aiChooseBlocks(i,atkUids){
  const P=G.p[i],O=G.p[1-i];const blocks={};let avail=O.board.filter(canBlock);
  const atks=atkUids.map(id=>P.board.find(x=>x.uid===id)).filter(Boolean).sort((a,b)=>effAtk(b,P)-effAtk(a,P));
  let incoming=atks.reduce((z,a)=>z+effAtk(a,P),0);
  for(const a of atks){const ea=effAtk(a,P);
    let pick=avail.find(b=>b.hp>ea&&effAtk(b,O)>=a.hp)||avail.find(b=>b.hp>ea)||avail.find(b=>effAtk(b,O)>=a.hp&&uval(b,O)<=uval(a,P));

    if(pick){blocks[a.uid]=[pick.uid];avail=avail.filter(b=>b!==pick);incoming-=ea}}

function risks(P){const o=[];const any=t=>P.board.some(u=>has(u,t));

function aiChoose(i){
  const P=G.p[i],O=G.p[1-i];let best=null;
  var best_trial=null;
  const holdsInt=P.hand.some(h=>CARDS[h].type==="int")&&O.hand.length>0;
  P.hand.forEach((id,hi)=>{if(canPlay(i,hi))return;const d=CARDS[id];let s=0;
    if(d.type==="dis"){const sc=x=>{if(!x)return 0;const a=P.board.filter(u=>x.ind.includes(u.id)).reduce((z,u)=>z+u.atk+1,0)+P.hand.filter(h=>x.ind.includes(h)).length*1.5;
        const b=O.board.filter(u=>x.ind.includes(u.id)).reduce((z,u)=>z+u.atk+1,0);return a-b};
      s=(sc(d)-sc(fieldDis()))*1.2+(G.field?(O.cure-P.cure)*.4:0);if(s<1.5)s=-1}

    else if(d.id==="a_trial"){const w=trialPairs(i).filter(p=>tScore(p[0].id)>tScore(p[1].id)).sort((x,y)=>effAtk(y[1],O)-effAtk(x[1],O))[0];s=w?7+effAtk(w[1],O):-1;if(w)best_trial=w}

    else if(d.id==="a_ritiro"){const v=X=>X.board.reduce((z,u)=>z+effAtk(u,X)+u.hp,0)+X.recs.length*2;const diff=v(O)-v(P)+(G.field?(O.cure-P.cure)*.8:0);s=diff>=8?diff:-1}
    else if(d.type==="rec"){const n=P.board.filter(u=>has(u,d.tag)).length+P.hand.filter(h=>CARDS[h].tags&&CARDS[h].tags.includes(d.tag)).length*.5;s=n?3+n*2:-1}

function applyFx(){
  if(!G)return;const now=Date.now();

  const add=(e,c)=>{if(!e)return;e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
  const snd=new Set();
  (G.fx||[]).forEach(f=>{
    if(f.k==="enter"){add(el(f.uid),"fx-enter");snd.add("play")}
    if(f.k==="evolve"){add(el(f.uid),"fx-evolve");snd.add("heal")}

app.addEventListener("click",e=>{

      const cur=Object.keys(C.blocks).find(k=>C.blocks[k].includes(uid));
      Object.keys(C.blocks).forEach(k=>C.blocks[k]=C.blocks[k].filter(x=>x!==uid));
      if(C.pick!=null&&String(C.pick)!==cur)(C.blocks[C.pick]=C.blocks[C.pick]||[]).push(uid);
      else if(C.pick==null)log("Prima tocca l'attaccante da parare.");

    return}

    else{const t=CARDS[G.p[0].hand[hi]].type;play(0,hi);checkEnd();if(t==="drug"&&!G.over)respondAI(1)}render();return}
  if(e.target.closest("[data-trialx]")){G.trial=null;log("Trial annullato.");render();return}
  const u=e.target.closest("[data-unit]");
  if(G.trial){if(u){const uid=+u.dataset.unit;
      if(u.dataset.side==="0"){G.trial.a=uid;const x=G.p[0].board.find(z=>z.uid===uid);log(`${D(x).n}: ${D(x).E} + ${D(x).T} = ${tScore(x.id)}. Ora scegli il farmaco del rivale.`)}
      else if(G.trial.a!=null){const tr=G.trial;G.trial=null;play(0,tr.hi,{a:tr.a,b:uid})}}
    render();return}
  if(u&&u.dataset.side==="0"){const uid=+u.dataset.unit;const x=G.p[0].board.find(z=>z.uid===uid);G.atkSel=G.atkSel||[];
    if(G.atkSel.includes(uid))G.atkSel=G.atkSel.filter(z=>z!==uid);

    else if(x)log(`${D(x).n} non può attaccare: ${x.tap?"è impegnata":"è appena entrata in campo"}.`);
    render()}
});

function rollRarity(guar){const r=Math.random()*100;if(guar)return r<4?"L":r<24?"R":"U";return r<1?"L":r<7?"R":r<29?"U":"C"}
function openPack(){
  if(S.crediti<PACK_COST)return;S.crediti-=PACK_COST;
  const cards=[];for(let k=0;k<5;k++){const rr=rollRarity(k===4);const pool=ALL.filter(d=>d.r===rr);cards.push(pool[Math.floor(Math.random()*pool.length)].id)}
  packOpen={cards,shown:cards.map(()=>false),isNew:cards.map(()=>false)};
  cards.forEach((id,k)=>{if(!S.col[id])packOpen.isNew[k]=true;S.col[id]=(S.col[id]||0)+1});
  save();render();
}
function extras(){let n=0;for(const id in S.col){const d=CARDS[id];if(d)n+=Math.max(0,S.col[id]-maxCopies(d))}return n}
function recycle(){for(const id in S.col){const d=CARDS[id];if(!d)continue;const ex=Math.max(0,S.col[id]-maxCopies(d));if(ex){S.col[id]-=ex;S.crediti+=5*ex}}save();render()}
function renderPacks(){
  const ex=extras();
  app.innerHTML=`<h2 class="sec">Bustine</h2>
    <p class="sub">Ogni bustina contiene 5 carte tra farmaci, recettori e interazioni. L'ultima è almeno non comune.</p>

      <button class="btn" id="rec" ${ex?"":"disabled"}>Ricicla doppioni (${ex} × 5 crediti)</button></div>
    <p class="odds" style="margin-top:10px">Probabilità per carta: comune 71% · non comune 22% · rara 6% · leggendaria 1%. Si riciclano solo le copie oltre il massimo da mazzo (2, oppure 1 per le leggendarie).</p>
    ${S.crediti<PACK_COST&&!packOpen?`<p class="sub">Crediti insufficienti. Vinci un duello per guadagnarne.</p>`:""}
    <div class="reveal">${packOpen?packOpen.cards.map((id,k)=>packOpen.shown[k]?cardHTML(CARDS[id],"full",{isNew:packOpen.isNew[k],btn:true,attrs:`data-detail="${id}"`}):`<button class="back" data-flip="${k}" aria-label="Rivela carta">${BACKSVG}<span class="bl">Sola Dosis</span><small>tocca per rivelare</small></button>`).join(""):""}</div>`;
  document.getElementById("buy").onclick=openPack;
  const a=document.getElementById("all");if(a)a.onclick=()=>{packOpen.shown=packOpen.shown.map(()=>true);sfx(packOpen.cards.some(id=>"RL".includes(CARDS[id].r))?"rare":"flip");render();app.querySelectorAll(".reveal > *").forEach((c,k)=>{c.style.animationDelay=(k*90)+"ms";c.classList.add("fx-flip")})};
  document.getElementById("rec").onclick=recycle;

  if(packOpen&&packOpen.flip!=null){const c=app.querySelectorAll(".reveal > *")[packOpen.flip];if(c)c.classList.add("fx-flip");packOpen.flip=null}
}

// =================== MAZZO ===================
function deckCount(){const c={};S.deck.forEach(i=>c[i]=(c[i]||0)+1);return c}
function cardScore(d){if(d.type!=="drug")return 2;const a=d.ab;
  return (d.E+d.T*.6)/(d.c)+(a.antag?.3:0)+(a.charge?.4:0)+(a.taunt?.3:0)+(a.inhib||0)*.4+(a.induce||0)*.4-(a.nti?.3:0)+(d.from?.6:0)}
// ----- mazzo mono-indicazione: tutto ruota attorno a una sola condizione clinica -----
const DIS_REC={d_neuro:["r_a2d","r_sert"],d_depressione:["r_sert"],d_epilessia:["r_nach","r_gaba"],d_schizofrenia:["r_d2"],d_ipertensione:["r_at1","r_b1"],d_tvp:["r_xa","r_vkor"],d_sca:["r_p2y12","r_hmg"],d_emorragia:[],d_ivu:["r_pbp"],d_sepsi:["r_pbp","r_ribo"],d_osteo:[],d_ipotiroidismo:[],d_ipertiroidismo:[],d_surrene:["r_gr"],d_postop:["r_mu","r_cox1","r_cox2"],d_emicrania:["r_5ht","r_cox1"],d_fa:["r_b1","r_nak"],d_scompenso:["r_b1","r_nak"],d_dm2:[],d_polmonite:["r_pbp"],d_ansia:["r_gaba"]};
function monoInfo(dis){const own=id=>Math.min(S.col[id]||0,maxCopies(CARDS[id]));
  const ind=dis.ind.filter(id=>own(id)&&(!CARDS[id].from||own(CARDS[id].from)||dis.ind.includes(CARDS[id].from)));
  return {ind,copies:ind.reduce((z,id)=>z+own(id),0),hasDis:own(dis.id)>0}}
function buildMonoDeck(dis){
  const deck=[],cnt={};const own=id=>Math.min(S.col[id]||0,maxCopies(CARDS[id]));
  const add=(id,n=2)=>{for(let k=0;k<n;k++){if(deck.length>=DECK_SIZE||(cnt[id]||0)>=own(id))return;cnt[id]=(cnt[id]||0)+1;deck.push(id)}};
  add(dis.id,2);
  // farmaci indicati: prima le basi delle evoluzioni, poi i più forti
  const ind=dis.ind.map(id=>CARDS[id]).filter(d=>own(d.id)).sort((a,b)=>(b.E+b.T*.6)/b.c-(a.E+a.T*.6)/a.c);
  ind.filter(d=>d.from&&own(d.from)).forEach(d=>{add(d.from,2);add(d.id,2)});
  ind.filter(d=>!d.from).forEach(d=>add(d.id,2));
  const inDeck=t=>deck.some(id=>CARDS[id].tags&&CARDS[id].tags.includes(t));
  (DIS_REC[dis.id]||[]).forEach(r=>{if(own(r)&&inDeck(CARDS[r].tag))add(r,1)});
  SCIS.forEach(sc=>{if(own(sc.id)&&deck.filter(id=>sciMatch(sc,id)).length>=2)add(sc.id,1)});
  add("a_pront",2);add("a_review",1);add("a_trial",1);add("a_ritiro",1);
  // completa con istantanei e poi con i farmaci migliori fuori indicazione
  INTS.forEach(d=>add(d.id,1));
  // evita di mettere nel mazzo combinazioni a rischio di interazione
  const risky=id=>{const t=new Set(deck.flatMap(x=>CARDS[x].tags||[]));const n=CARDS[id].tags||[];const h=x=>t.has(x)||n.includes(x);
    const ser=new Set(deck.filter(x=>(CARDS[x].tags||[]).includes("serot")));if(n.includes("serot"))ser.add(id);
    return (h("oppioide")&&h("benzo"))||ser.size>=2||(h("fans")&&h("anticoag"))||(h("fans")&&h("acei")&&h("diuretico"))||(h("statina")&&h("cyp3a4inib"))||new Set([...deck,id].filter(x=>(CARDS[x].tags||[]).some(t=>BLEED.includes(t)))).size>=2||([...deck,id].some(x=>CARDS[x].ab&&CARDS[x].ab.inhib)&&[...deck,id].some(x=>CARDS[x].ab&&CARDS[x].ab.nti))};
  ALL.filter(d=>d.type==="drug"&&!d.from&&own(d.id)&&!dis.ind.includes(d.id)).sort((a,b)=>cardScore(b)-cardScore(a)).forEach(d=>{if(!risky(d.id))add(d.id,2)});
  S.deck=deck;save();
  const n=deck.filter(id=>dis.ind.includes(id)).length;
  monoMsg=`Mazzo «${dis.n}»: ${deck.length} carte, di cui ${n} farmaci indicati, ${cnt[dis.id]||0} carte condizione, ${deck.filter(id=>CARDS[id].type==="rec").length} recettori, ${deck.filter(id=>CARDS[id].type==="sci").length} scienziati.${n<8?" Hai pochi farmaci indicati: apri altre bustine per rinforzarlo.":""}${deck.length<DECK_SIZE?` Mancano ${DECK_SIZE-deck.length} carte: la collezione non basta.`:""}`;
  render();
}
let monoMsg="";
// ----- mazzo per categoria terapeutica -----
function catDeck(cl,own){
  const deck=[],cnt={};
  const add=(id,n=2)=>{for(let k=0;k<n;k++){if(deck.length>=DECK_SIZE||(cnt[id]||0)>=own(id))return;cnt[id]=(cnt[id]||0)+1;deck.push(id)}};
  const score=d=>(d.E+d.T*.6)/d.c+(d.ab.charge?.3:0)+(d.ab.taunt?.2:0)+(d.ab.heal?.2:0)+(d.ab.inhib?.2:0)-(d.ab.nti?.3:0);
  const drugs=DRUGS.filter(d=>d.cl===cl&&own(d.id));
  const conds=DIS.filter(d=>d.cat===cl&&own(d.id)).map(d=>({d,n:d.ind.filter(i=>drugs.some(x=>x.id===i)).length})).sort((a,b)=>b.n-a.n);
  if(conds[0])add(conds[0].d.id,2);if(conds[1])add(conds[1].d.id,1);add("a_ritiro",1);["i_bleed","i_qt","i_pk","i_sero"].filter(own).slice(0,2).forEach(id=>add(id,1));
  drugs.filter(d=>d.from&&own(d.from)).sort((a,b)=>score(b)-score(a)).slice(0,2).forEach(d=>{add(d.from,1);add(d.id,1)});
  drugs.filter(d=>!d.from).sort((a,b)=>score(b)-score(a)).slice(0,6).forEach(d=>add(d.id,2));
  const tags=t=>deck.filter(id=>(CARDS[id].tags||[]).includes(t)).length;
  RECS.filter(r=>own(r.id)&&tags(r.tag)>=2).sort((a,b)=>tags(b.tag)-tags(a.tag)).slice(0,2).forEach(r=>add(r.id,1));
  SCIS.filter(sc=>own(sc.id)&&deck.filter(id=>sciMatch(sc,id)).length>=2).slice(0,2).forEach(sc=>add(sc.id,1));
  add("a_pront",1);
  drugs.filter(d=>!d.from).sort((a,b)=>score(b)-score(a)).forEach(d=>add(d.id,2));
  drugs.filter(d=>d.from).forEach(d=>add(d.id,1));
  add("a_review",1);INTS.forEach(d=>add(d.id,1));
  DRUGS.filter(d=>d.cl==="antid"&&own(d.id)).forEach(d=>add(d.id,1));
  ALL.filter(d=>d.type==="drug"&&!d.from&&own(d.id)).sort((a,b)=>cardScore(b)-cardScore(a)).forEach(d=>add(d.id,2));
  ALL.filter(d=>own(d.id)&&!(d.from&&!cnt[d.from])).forEach(d=>add(d.id,2));
  return deck;
}
const CATS=["analg","snc","cardio","emo","anti","endo"];
function buildCatDeck(cl){
  const own=id=>Math.min(S.col[id]||0,maxCopies(CARDS[id]));
  S.deck=catDeck(cl,own);save();
  const n=S.deck.filter(id=>CARDS[id].cl===cl).length;
  monoMsg=`Mazzo «${CLS[cl].n}»: ${S.deck.length} carte, ${n} farmaci della categoria, ${S.deck.filter(id=>CARDS[id].type==="dis").length} condizioni, ${S.deck.filter(id=>CARDS[id].type==="rec").length} bersagli.${n<10?" Hai ancora poche carte di questa categoria: apri altre bustine.":""}${S.deck.length<DECK_SIZE?` Mancano ${DECK_SIZE-S.deck.length} carte.`:""}`;
  render();
}
function autoDeck(){
  const deck=[],cnt={};const lim=d=>Math.min(S.col[d.id]||0,maxCopies(d));
  const add=d=>{if(deck.length>=DECK_SIZE||(cnt[d.id]||0)>=lim(d))return false;cnt[d.id]=(cnt[d.id]||0)+1;deck.push(d.id);return true};
  const drugs=ALL.filter(d=>d.type==="drug"&&S.col[d.id]).sort((a,b)=>cardScore(b)-cardScore(a));
  // basi delle evoluzioni possedute, poi le evoluzioni
  drugs.filter(d=>d.from&&S.col[d.from]).slice(0,3).forEach(d=>{add(CARDS[d.from]);add(CARDS[d.from]);add(d)});
  drugs.filter(d=>!d.from).forEach(d=>{if(deck.length<15){add(d);add(d)}});
  ALL.filter(d=>d.type==="rec"&&S.col[d.id]).forEach(d=>{if(deck.filter(i=>CARDS[i].tags&&CARDS[i].tags.includes(d.tag)).length>=2)add(d)});
  ALL.filter(d=>d.type==="int"&&S.col[d.id]).slice(0,2).forEach(add);
  ALL.filter(d=>d.type==="sci"&&S.col[d.id]).forEach(d=>{if(deck.filter(i=>sciMatch(d,i)).length>=2)add(d)});
  const bestDis=DIS.filter(d=>S.col[d.id]).map(d=>({d,n:deck.filter(i=>d.ind.includes(i)).length})).sort((a,b)=>b.n-a.n)[0];
  if(bestDis){add(bestDis.d);add(bestDis.d)}
  ["a_pront","a_review","a_repo"].forEach(id=>{if(S.col[id])add(CARDS[id])});
  drugs.forEach(d=>{if(!d.from||cnt[d.from]){add(d);add(d)}});
  S.deck=deck;save();render();
}
function renderDeck(){
  const dc=deckCount();const n=S.deck.length;
  const curve=[1,2,3,4,5,6,7].map(c=>S.deck.filter(i=>{const d=CARDS[i];return Math.min(d.from?d.ec:d.c,7)===c}).length);const mx=Math.max(1,...curve);
  const owned=ALL.filter(d=>S.col[d.id]);

  const row=(d,side)=>{const inD=dc[d.id]||0;const lim=Math.min(S.col[d.id]||0,maxCopies(d));

      <span class="n"><b>${d.n}</b><small>${CLS[d.cl].n}${d.tier?" · "+TIER[d.tier].n:""}${d.from?" · evolve da "+CARDS[d.from].n:""}</small></span>
      <span class="s">${stat}${side==="col"?` · ${inD}/${lim}`:` · ×${inD}`}</span>
      ${side==="col"?`<button data-add="${d.id}" aria-label="Aggiungi ${d.n}" ${inD>=lim||n>=DECK_SIZE?"disabled":""}>+</button>`:`<button data-rem="${d.id}" aria-label="Togli ${d.n}">−</button>`}</div>`};

  app.innerHTML=`<h2 class="sec">Mazzo</h2>
    <p class="sub">Servono esattamente ${DECK_SIZE} carte, al massimo 2 copie per carta e 1 per le leggendarie. Un'evoluzione senza la sua base nel mazzo non si potrà mai giocare.</p>
    <div class="row" style="margin-bottom:14px"><button class="btn" id="auto">Componi in automatico</button><button class="btn" id="clr">Svuota</button></div>
    <h3 class="sub3">Mazzo per categoria</h3>
    <p class="sub">Costruisce il mazzo con le tue carte di una sola categoria terapeutica, con le condizioni, i bersagli e gli scienziati collegati.</p>
    <div class="chips">${CATS.map(c=>{const n=ALL.filter(d=>d.type==="drug"&&d.cl===c&&S.col[d.id]).length,t=DRUGS.filter(d=>d.cl===c).length;return `<button class="chip" data-cat="${c}" ${n?"":"disabled"}>${CLS[c].n} · ${n}/${t} farmaci</button>`}).join("")}</div>
    <h3 class="sub3">Mazzo mono-indicazione</h3>
    <p class="sub">Costruisce il mazzo con le tue carte attorno a una sola condizione: la carta condizione, i farmaci indicati con le loro evoluzioni, i recettori e gli scienziati collegati, il Prontuario per trovarli.</p>
    <div class="chips">${DIS.filter(d=>monoInfo(d).ind.length).map(d=>{const m=monoInfo(d);return `<button class="chip" data-mono="${d.id}" ${m.ind.length?"":"disabled"} title="${m.ind.length?m.ind.map(i=>CARDS[i].n).join(", "):"nessun farmaco indicato nella collezione"}">${d.n} · ${m.copies} indicati${m.hasDis?"":" · senza carta condizione"}</button>`}).join("")}</div>
    ${monoMsg?`<p class="sub" style="color:var(--ink)">${monoMsg}</p>`:""}
    <div class="deckgrid">

      <div class="list" aria-label="Mazzo"><div class="deckhead"><span>Mazzo</span><span class="${n===DECK_SIZE?"ok":"ko"}">${n}/${DECK_SIZE}</span></div>
        ${orphan.length?`<div class="deckhead"><span class="ko">Senza base: ${[...new Set(orphan)].join(", ")}</span></div>`:""}
        <div class="curve" aria-label="Curva dei costi">${curve.map((v,k)=>`<div><span>${v||""}</span><i style="height:${v/mx*48}px"></i><span>${k===6?"7+":k+1}</span></div>`).join("")}</div>
        ${deckCards.length?deckCards.map(d=>row(d,"deck")).join(""):'<div class="li"><span></span><span class="n"><small>Aggiungi carte dalla colonna a sinistra.</small></span></div>'}
      </div>

  document.getElementById("auto").onclick=()=>{monoMsg="";autoDeck()};
  app.querySelectorAll("[data-mono]").forEach(b=>b.onclick=()=>buildMonoDeck(CARDS[b.dataset.mono]));
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>buildCatDeck(b.dataset.cat));
  document.getElementById("clr").onclick=()=>{S.deck=[];save();render()};
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{S.deck.push(b.dataset.add);save();render()});
  app.querySelectorAll("[data-rem]").forEach(b=>b.onclick=()=>{const k=S.deck.indexOf(b.dataset.rem);if(k>-1)S.deck.splice(k,1);save();render()});
}

<script>
(function(){

  var bar=document.getElementById("sd-update"),btn=document.getElementById("sd-update-btn"),reloading=false;
  function show(reg){bar.classList.add("on");btn.onclick=function(){btn.disabled=true;if(reg.waiting)reg.waiting.postMessage("skip")}}
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloading)return;reloading=true;location.reload()});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller)show(reg);
      reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;
        w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)show(reg)})});
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")reg.update().catch(function(){})});
      setInterval(function(){reg.update().catch(function(){})},30*60*1000);
    }).catch(function(){});
  });
})();
